[project]
name = "stock-predict-v2"
version = "0.1.0"
description = "Stock prediction, strategy and backtest system with real market data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
    "akshare>=1.14.0",
    "tushare>=1.4.0",
    "scipy>=1.10",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
full = [
    "xgboost>=2.0",
    "catboost>=1.2",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

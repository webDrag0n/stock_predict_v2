[project]
name = "stock-predict-v2"
version = "0.1.0"
description = "Stock prediction, strategy and backtest system with real market data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "yfinance>=0.2.40",
    "akshare>=1.14.0",
    "tushare>=1.4.0",
    "scipy>=1.10",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
full = [
    "xgboost>=2.0",
    "catboost>=1.2",
]
ui = [
    "dash>=4.0",
    "dash-bootstrap-components>=2.0",
    "plotly>=6.0",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
attn = [
    "torch>=2.0",
]

[tool.uv]
# 本仓库是"框架系统"而非可安装库：不打包、不发布，uv 仅用于依赖锁定与虚拟环境管理
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E402: 非包结构下入口脚本必须先注入 sys.path 再 import 项目模块（约定见 DEVELOPMENT.md §1.5）
ignore = ["E402"]
